[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-bot"
version = "0.1.0"
description = "Customer support chatbot for a delivery service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.15.0",
    "aiohttp==3.10.10",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "httpx==0.27.2",
    "structlog==24.4.0",
    "redis==5.2.0",
    "arq==0.26.1",
    "SQLAlchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "python-dotenv==1.0.1",
    "prometheus-client==0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "fakeredis[lua]==2.26.1",
    "ruff==0.8.0",
    "mypy==1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

# FastAPI: Depends(...) в defaults — идиоматичный DI, не баг B008.
[tool.ruff.lint.per-file-ignores]
"src/delivery_bot/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["delivery_bot"]
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = false
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "delivery_bot.services.*",
    "delivery_bot.dialog.*",
    "delivery_bot.security.*",
    "delivery_bot.webapp.telegram_auth",
]
strict = true

[[tool.mypy.overrides]]
module = [
    "arq.*",
    "redis.*",
    "fakeredis.*",
    "prometheus_client.*",
]
ignore_missing_imports = true
