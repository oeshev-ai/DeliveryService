<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Статус заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzPuCTSzkweSfpBZ9BJuL5WHkE="
      crossorigin=""
    />
    <link rel="stylesheet" href="./assets/app.css" />
  </head>
  <body>
    <main class="screen">
      <header class="brand">
        <p class="brand__name">Delivery</p>
        <p class="brand__sub">Статус заказа</p>
      </header>

      <nav class="tabs" id="tabs" hidden>
        <button type="button" class="tab is-active" data-tab="status">Статус</button>
        <button type="button" class="tab" data-tab="map">Карта</button>
        <button type="button" class="tab" data-tab="history">История</button>
      </nav>

      <section id="state-loading" class="card" hidden>
        <p class="muted">Загружаем статус…</p>
      </section>

      <section id="state-error" class="card card--error" hidden>
        <p id="error-text">Не удалось загрузить заказ.</p>
        <button type="button" id="btn-retry" class="btn">Повторить</button>
      </section>

      <section id="panel-status" class="card" hidden>
        <div class="status-row">
          <span id="status-dot" class="status-dot" aria-hidden="true"></span>
          <div>
            <p id="order-id" class="order-id"></p>
            <p id="status-label" class="status-label"></p>
          </div>
        </div>

        <div class="eta" id="eta-block" hidden>
          <p class="eta__label">Ожидаемое время</p>
          <p class="eta__value"><span id="eta-minutes"></span> мин</p>
        </div>

        <dl class="meta">
          <div>
            <dt>Слот</dt>
            <dd id="delivery-slot">—</dd>
          </div>
          <div>
            <dt>Адрес</dt>
            <dd id="address">—</dd>
          </div>
          <div>
            <dt>Курьер</dt>
            <dd id="courier">—</dd>
          </div>
          <div>
            <dt>Телефон курьера</dt>
            <dd id="courier-phone">—</dd>
          </div>
          <div>
            <dt>Сумма</dt>
            <dd id="total">—</dd>
          </div>
          <div>
            <dt>Позиций</dt>
            <dd id="items-count">—</dd>
          </div>
        </dl>
      </section>

      <section id="panel-map" class="card card--map" hidden>
        <p id="map-note" class="muted map-note"></p>
        <div id="map" class="map" role="img" aria-label="Карта доставки"></div>
        <p id="map-fallback" class="muted" hidden>
          Геолокация курьера временно недоступна. Показан адрес доставки и ETA из заказа.
        </p>
      </section>

      <section id="panel-history" class="card" hidden>
        <p class="muted">Ваши заказы</p>
        <div id="history-list" class="history-list"></div>
      </section>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./assets/app.js"></script>
  </body>
</html>
